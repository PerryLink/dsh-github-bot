<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="fig-title">
<title id="fig-title">dsh-github-bot — the trust boundary: seven read tools cross the seam directly to api.github.com; the eight write tools stop at the tools/pre-execute gate, where allowedActions denies unknown actions before the prompt, the CI driver is allowed through ci.autoApprove, and everything else asks ctx.approval and fails closed without an answerer; the background review job returns through the same gate to post; the CI lane runs underneath; the token only ever travels in the Authorization header</title>
