<text x="560" y="543" fill="#323139" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" text-anchor="start">inline comments + status check → result.json / summary.md</text>
<text x="560" y="566" fill="#4c5160" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" text-anchor="start">idempotent per head commit · ci.autoApprove is the allowlist</text>
