<text x="64" y="190" fill="#4c5160" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" text-anchor="start">gather read-only context, then queue a turn</text>
